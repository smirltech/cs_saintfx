services:
    masomo-soft:
        image: jkaninda/nginx-php-fpm:8.3
        container_name: masomo-soft
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
            - ../storage/library:/var/www/html/storage/app
        ports:
            - '9080:80'
        networks:
            - smirltech
networks:
    sagenet:
        name: smirltech
        external: true
